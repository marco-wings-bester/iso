<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- user-scalable=no stops pinch-zoom which causes scroll on iOS -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Farm Walk</title>
  <style>
    html {
      height: 100%;
      overflow: hidden;
    }
    body {
      margin: 0;
      padding: 0;
      background: #5a9e4a;
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* position:fixed prevents iOS Safari rubber-band scroll */
      position: fixed;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
