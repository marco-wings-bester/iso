<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- user-scalable=no stops pinch-zoom which causes scroll on iOS -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Farm Walk</title>
  <meta name="theme-color" content="#5a9e4a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Farm Walk" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <style>
    html {
      height: 100%;
      overflow: hidden;
    }
    body {
      margin: 0;
      padding: 0;
      background: #5a9e4a;
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* position:fixed prevents iOS Safari rubber-band scroll */
      position: fixed;
    }
    canvas { display: block; }
    #boot {
      position: fixed;
      left: 16px;
      right: 16px;
      top: 45%;
      z-index: 10;
      text-align: center;
      font: 16px/1.4 sans-serif;
      color: #fff;
      text-shadow: 0 1px 3px #000;
    }
    #boot button {
      display: block;
      margin: 12px auto 0;
      padding: 8px 20px;
      font: inherit;
      border: 0;
      border-radius: 6px;
      background: #2e1d0c;
      color: #fff;
    }
    #update-btn {
      position: fixed;
      left: 50%;
      top: calc(56px + env(safe-area-inset-top));
      transform: translateX(-50%);
      z-index: 25;
      padding: 10px 16px;
      border: 2px solid #2e1d0c;
      border-radius: 10px;
      background: #f8d870;
      color: #2e1d0c;
      font: bold 15px sans-serif;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }
    .toast, #update-toast {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      padding: 8px 14px;
      border-radius: 10px;
      background: rgba(46, 29, 12, 0.9);
      color: #f8d870;
      font: bold 14px sans-serif;
      white-space: nowrap;
      pointer-events: none;
    }
    #update-toast { top: calc(56px + env(safe-area-inset-top)); }
    .toast { bottom: calc(76px + env(safe-area-inset-bottom)); }
    #menu-btn {
      position: fixed;
      left: 12px;
      bottom: calc(14px + env(safe-area-inset-bottom));
      z-index: 20;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 2px solid #f8d870;
      border-radius: 10px;
      background: rgba(46, 29, 12, 0.88);
      color: #f8d870;
      font: bold 22px/1 sans-serif;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }
    .pov-view #menu-btn, .pov-view .overlay { display: none; }
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.55);
    }
    .card {
      width: 100%;
      max-width: 320px;
      padding: 18px 18px 16px;
      border: 3px solid #2e1d0c;
      border-radius: 12px;
      background: #f8f0e0;
      color: #2e1d0c;
      font: 15px/1.45 sans-serif;
      box-shadow: 0 4px 0 #2e1d0c;
    }
    .card h2 { margin: 0 0 12px; font-size: 20px; }
    .card p { margin: 0 0 14px; }
    .menu-buttons { display: flex; flex-direction: column; gap: 10px; }
    .actions { display: flex; gap: 10px; justify-content: flex-end; }
    .btn {
      display: block;
      padding: 12px 16px;
      border-radius: 9px;
      font: bold 16px sans-serif;
      text-align: center;
      text-decoration: none;
    }
    .btn.primary { background: #d04c3a; color: #fff; border: 2px solid #982f2a; }
    .btn.share { background: #4f8a30; color: #fff; border: 2px solid #3f7228; }
    .btn.secondary { background: transparent; color: #2e1d0c; border: 2px solid #2e1d0c; }
    .btn:disabled { background: #d8ccb8; color: #6b5a44; border-color: #b8a88e; }
    .link { width: 100%; box-sizing: border-box; margin: 0 0 14px; padding: 10px; font: 14px monospace; border: 2px solid #2e1d0c; border-radius: 8px; }
  </style>
  <script>
    // Chrome offers its install prompt via this event; keep it for the
    // menu's "Install app" button (src/menu.js).
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.farmWalkInstallPrompt = e;
      window.dispatchEvent(new Event('farmwalk-installable'));
    });
  </script>
  <script>
    // Boot guard. If the game's code fails to load (e.g. a page cached from
    // before an update asks for a file that no longer exists), clear the
    // offline cache and reload once. Any other error is shown on screen
    // instead of leaving a blank page.
    (function () {
      var KEY = 'farm-walk-recovered';

      function recover() {
        try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
        var reload = function () { location.replace(location.pathname + '?v=' + Date.now()); };
        Promise.all([
          window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : 0,
          navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }) : 0,
        ]).then(reload, reload);
      }

      function show(msg) {
        var el = document.getElementById('boot');
        if (!el) {
          el = document.createElement('div');
          el.id = 'boot';
          document.body.appendChild(el);
        }
        el.textContent = msg;
        var btn = document.createElement('button');
        btn.textContent = 'Reload';
        btn.onclick = recover;
        el.appendChild(btn);
      }
      window.farmWalkShowError = show;

      window.addEventListener('error', function (e) {
        if (e.target && e.target.tagName === 'SCRIPT') {
          var retried = false;
          try { retried = sessionStorage.getItem(KEY); } catch (err) {}
          if (!retried) return recover();
          return show('The game failed to load. Check your connection and try again.');
        }
        show('Something went wrong: ' + (e.message || 'unknown error'));
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        show('Something went wrong: ' + ((e.reason && e.reason.message) || e.reason));
      });
      setTimeout(function () {
        if (document.getElementById('boot') && !window.farmWalkStarted) show('Still loading…');
      }, 20000);
    })();
  </script>
</head>
<body>
  <div id="boot">Loading farm…</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
