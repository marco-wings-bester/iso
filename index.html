<!DOCTYPE html>
<html lang="af" translate="no">
<head>
  <meta charset="UTF-8" />
  <!-- user-scalable=no stops pinch-zoom which causes scroll on iOS -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Farm Walk</title>
  <!-- the game has its own languages (menu): no "Translate page?" offer from Chrome -->
  <meta name="google" content="notranslate" />
  <meta name="theme-color" content="#5a9e4a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Farm Walk" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <style>
    html {
      height: 100%;
      overflow: hidden;
    }
    body {
      margin: 0;
      padding: 0;
      background: #5a9e4a;
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* position:fixed prevents iOS Safari rubber-band scroll */
      position: fixed;
    }
    canvas { display: block; }
    #boot {
      position: fixed;
      left: 16px;
      right: 16px;
      top: 45%;
      z-index: 10;
      text-align: center;
      font: bold 17px/1.4 sans-serif;
      color: #fff;
      text-shadow: 0 1px 3px #000;
    }
    #boot button {
      display: block;
      margin: 12px auto 0;
      padding: 8px 20px;
      font: inherit;
      border: 0;
      border-radius: 6px;
      background: #2e1d0c;
      color: #fff;
    }
    #update-btn {
      position: fixed;
      left: 50%;
      top: calc(56px + env(safe-area-inset-top));
      transform: translateX(-50%);
      z-index: 25;
      padding: 10px 16px;
      border: 2px solid #2e1d0c;
      border-radius: 10px;
      background: #f8d870;
      color: #2e1d0c;
      font: bold 16px sans-serif;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }
    .toast, #update-toast {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      padding: 8px 14px;
      border-radius: 10px;
      background: rgba(46, 29, 12, 0.9);
      color: #f8d870;
      font: bold 15px sans-serif;
      white-space: nowrap;
      pointer-events: none;
    }
    #update-toast { top: calc(56px + env(safe-area-inset-top)); }
    .toast { bottom: calc(76px + env(safe-area-inset-bottom)); }
    #menu-btn {
      position: fixed;
      left: 12px;
      bottom: calc(14px + env(safe-area-inset-bottom));
      z-index: 20;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 2px solid #f8d870;
      border-radius: 10px;
      background: rgba(46, 29, 12, 0.88);
      color: #f8d870;
      font: bold 22px/1 sans-serif;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }
    #menu-btn.pulse { animation: pulse 0.9s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(1.15); box-shadow: 0 0 0 8px rgba(248, 216, 112, 0.65); } }
    #install-pill {
      position: fixed;
      left: 66px;
      bottom: calc(14px + env(safe-area-inset-bottom));
      z-index: 20;
      height: 44px;
      padding: 0 14px;
      border: 2px solid #2e1d0c;
      border-radius: 10px;
      background: #f8d870;
      color: #2e1d0c;
      font: bold 16px sans-serif;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      animation: glow 2.2s ease-in-out 4;
    }
    @keyframes glow { 50% { box-shadow: 0 0 0 7px rgba(248, 216, 112, 0.6), 0 2px 6px rgba(0, 0, 0, 0.4); } }
    .tip {
      position: fixed;
      left: 8px;
      bottom: calc(74px + env(safe-area-inset-bottom));
      z-index: 26;
      max-width: 250px;
      padding: 10px 12px;
      border: 2px solid #2e1d0c;
      border-radius: 10px;
      background: #fff8e8;
      color: #2e1d0c;
      font: bold 16px/1.35 sans-serif;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      pointer-events: none;
    }
    .tip::after {
      content: '';
      position: absolute;
      left: 18px;
      bottom: -11px;
      border: 9px solid transparent;
      border-top-color: #2e1d0c;
      border-bottom: 0;
    }
    .pov-view #menu-btn, .pov-view .overlay, .choosing #menu-btn,
    .pov-view #install-pill, .choosing #install-pill, .pov-view .tip { display: none; }
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.55);
    }
    .card {
      width: 100%;
      max-width: 320px;
      padding: 18px 18px 16px;
      border: 3px solid #2e1d0c;
      border-radius: 12px;
      background: #f8f0e0;
      color: #2e1d0c;
      font: 16px/1.5 sans-serif;
      box-shadow: 0 4px 0 #2e1d0c;
    }
    .card { box-sizing: border-box; max-height: 100%; overflow-y: auto; }
    .card h2 { margin: 0 0 12px; font-size: 21px; }
    .card h3 { margin: 0 0 6px; font-size: 18px; }
    .card p { margin: 0 0 14px; }
    .welcome-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .welcome-head img { width: 52px; height: 52px; border: 2px solid #2e1d0c; border-radius: 12px; }
    .welcome-head h2 { margin: 0; }
    #welcome .setting { margin-bottom: 12px; }
    .section { margin: 0 0 12px; padding: 12px; border: 2px solid #2e1d0c; border-radius: 10px; background: #fffaf0; }
    .section.install { background: #fff1c4; border-color: #c8a440; }
    .section p { margin: 0 0 10px; }
    .section p:last-child { margin: 0; }
    .perks { font-size: 14px; color: #6b4a1a; }
    .note { font-size: 15px; }
    ol.steps { margin: 0 0 12px; padding-left: 24px; }
    ol.steps li { margin: 5px 0; }
    .key { display: inline-block; min-width: 1.2em; padding: 0 5px; border: 1.5px solid #2e1d0c; border-radius: 5px; background: #fff; font-weight: bold; text-align: center; line-height: 1.35; }
    .ico svg { vertical-align: -4px; }
    .menu-icon { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border: 2px solid #f8d870; border-radius: 6px; background: #2e1d0c; color: #f8d870; font-size: 15px; vertical-align: -4px; }
    .btn.big { padding: 14px 16px; font-size: 19px; }
    .menu-buttons { display: flex; flex-direction: column; gap: 10px; }
    .actions { display: flex; gap: 10px; justify-content: flex-end; }
    .btn {
      display: block;
      padding: 12px 16px;
      border-radius: 9px;
      font: bold 17px sans-serif;
      text-align: center;
      text-decoration: none;
    }
    .btn.primary { background: #d04c3a; color: #fff; border: 2px solid #982f2a; }
    .btn.share { background: #4f8a30; color: #fff; border: 2px solid #3f7228; }
    .btn.update { background: #3a6ea5; color: #fff; border: 2px solid #2c5684; }
    .btn.new { background: #f8d870; color: #2e1d0c; border: 2px solid #c8a440; }
    .btn.secondary { background: transparent; color: #2e1d0c; border: 2px solid #2e1d0c; }
    .btn.level { display: flex; flex-direction: column; gap: 2px; }
    .btn.level small { font: 14px sans-serif; opacity: 0.9; }
    .setting { display: flex; align-items: center; justify-content: space-between; gap: 8px; font: bold 16px sans-serif; }
    .seg { display: flex; border: 2px solid #2e1d0c; border-radius: 9px; overflow: hidden; }
    .seg button { padding: 8px 9px; border: 0; border-left: 2px solid #2e1d0c; background: transparent; color: #2e1d0c; font: bold 15px sans-serif; }
    .seg button:first-child { border-left: 0; }
    .seg button[aria-pressed="true"] { background: #2e1d0c; color: #f8d870; }
    .btn:disabled { background: #d8ccb8; color: #6b5a44; border-color: #b8a88e; }
    .link { width: 100%; box-sizing: border-box; margin: 0 0 14px; padding: 10px; font: 15px monospace; border: 2px solid #2e1d0c; border-radius: 8px; }
  </style>
  <script>
    // Chrome offers its install prompt via this event; keep it for the
    // menu's "Install app" button (src/menu.js).
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.farmWalkInstallPrompt = e;
      window.dispatchEvent(new Event('farmwalk-installable'));
    });
  </script>
  <script>
    // Boot guard. If the game's code fails to load (e.g. a page cached from
    // before an update asks for a file that no longer exists), clear the
    // offline cache and reload once. Any other error is shown on screen
    // instead of leaving a blank page.
    (function () {
      var KEY = 'farm-walk-recovered';
      // in the language chosen in the menu (src/settings.js): Afrikaans unless it's English
      var en = false;
      try { en = JSON.parse(localStorage.getItem('farm-walk-settings')).lang === 'en'; } catch (e) {}
      document.documentElement.lang = en ? 'en' : 'af';
      var t = function (af, english) { return en ? english : af; };
      window.farmWalkBootText = t('Laai die plaas…', 'Loading farm…');

      function recover() {
        try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
        var reload = function () { location.replace(location.pathname + '?v=' + Date.now()); };
        Promise.all([
          window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : 0,
          navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }) : 0,
        ]).then(reload, reload);
      }

      function show(msg) {
        var el = document.getElementById('boot');
        if (!el) {
          el = document.createElement('div');
          el.id = 'boot';
          document.body.appendChild(el);
        }
        el.textContent = msg;
        var btn = document.createElement('button');
        btn.textContent = t('Herlaai', 'Reload');
        btn.onclick = recover;
        el.appendChild(btn);
      }
      window.farmWalkShowError = show;

      window.addEventListener('error', function (e) {
        if (e.target && e.target.tagName === 'SCRIPT') {
          var retried = false;
          try { retried = sessionStorage.getItem(KEY); } catch (err) {}
          if (!retried) return recover();
          return show(t('Die speletjie wou nie laai nie. Kyk na jou verbinding en probeer weer.', 'The game failed to load. Check your connection and try again.'));
        }
        show(t('Iets het skeefgeloop: ', 'Something went wrong: ') + (e.message || t('onbekende fout', 'unknown error')));
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        show(t('Iets het skeefgeloop: ', 'Something went wrong: ') + ((e.reason && e.reason.message) || e.reason));
      });
      setTimeout(function () {
        if (document.getElementById('boot') && !window.farmWalkStarted) show(t('Laai nog steeds…', 'Still loading…'));
      }, 20000);
    })();
  </script>
</head>
<body>
  <div id="boot">Laai die plaas…</div>
  <script>document.getElementById('boot').textContent = window.farmWalkBootText;</script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
